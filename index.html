<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreachDetector - Data Leak Checker</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --danger: #f85149;
      --danger-bg: rgba(248, 81, 73, 0.1);
      --success: #3fb950;
      --success-bg: rgba(63, 185, 80, 0.1);
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --border: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }

    .container { width: 100%; max-width: 650px; margin-top: 2rem; }
    
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); font-size: 0.95rem; }

    .search-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
    
    .input-group { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; }
    @media (min-width: 480px) {
      .input-group { flex-direction: row; }
    }

    input[type="email"] {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="email"]:focus { border-color: var(--accent); }

    button.btn-search {
      padding: 0.85rem 1.5rem;
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button.btn-search:hover { background-color: var(--accent-hover); color: #fff; }

    .privacy-notice { text-align: center; font-size: 0.8rem; color: var(--text-muted); }

    #results { margin-top: 1.5rem; display: none; }
    
    .status-banner { padding: 1rem 1.25rem; border-radius: 8px; margin-bottom: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; }
    .status-banner.pwned { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); }
    .status-banner.clean { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); }

    .breach-list { display: flex; flex-direction: column; gap: 1rem; }
    .breach-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; }
    .breach-card h3 { color: #fff; font-size: 1.1rem; margin-bottom: 0.25rem; }
    .breach-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; margin-top: 0.5rem; }

    .spinner { display: none; text-align: center; padding: 1.5rem 0; color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Breach<span>Detector</span></h1>
      <p>Check if an email address appeared in known public data breaches</p>
    </div>

    <div class="search-card">
      <form id="searchForm">
        <div class="input-group">
          <input type="email" id="emailInput" placeholder="Enter email address" required>
          <button type="submit" class="btn-search">Check Email</button>
        </div>
      </form>
      <p class="privacy-notice">🔒 Queries are sent directly to public security registries via HTTPS.</p>
    </div>

    <div id="spinner" class="spinner">Searching breach database...</div>

    <div id="results">
      <div id="statusBanner" class="status-banner"></div>
      <div id="breachList" class="breach-list"></div>
    </div>
  </div>

      if(!email) return;
